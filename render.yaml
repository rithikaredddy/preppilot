# Render Blueprint: New > Blueprint in the Render dashboard, then pick this repo.
# Secrets marked sync: false are asked for once during setup.
services:
  - type: web
    name: interview-prep-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV_NAME
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: interview-prep-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_RESET_DEV_EXPOSE
        value: "false"
      - key: TPO_ALLOWED_EMAILS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_HOST
        sync: false

databases:
  - name: interview-prep-db
    plan: free
    databaseName: interview_prep
    user: interview
