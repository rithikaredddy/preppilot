# Render Blueprint (free plan): New > Blueprint in the Render dashboard, then pick this repo.
# Values marked sync: false are asked for once during setup. See README > Deploy for free.
services:
  - type: web
    name: preppilot-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV_NAME
        value: production
      # Neon free Postgres connection string (postgres://... is converted automatically).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PASSWORD_RESET_DEV_EXPOSE
        value: "false"
      - key: TPO_ALLOWED_EMAILS
        sync: false
      # Your Vercel URL, e.g. https://preppilot.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      # Free plan: run Python submissions with the guarded local runner.
      # Java and C++ need JUDGE0_URL (and JUDGE0_API_KEY / JUDGE0_HOST for RapidAPI).
      - key: ALLOW_LOCAL_CODE_RUNNER
        value: "true"
      - key: LOCAL_RUNNER_LANGUAGES
        value: python
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_HOST
        sync: false
      # Gmail SMTP (free) so TPO sign-up codes and password resets are emailed.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      # One worker fits the free plan's 512 MB and keeps the login throttle in one process.
      - key: WEB_CONCURRENCY
        value: "1"
