services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview_prep
    ports:
      - "5433:5432"
    volumes:
      - interview_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview_prep"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  interview_pg:
